<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웰컴 투 데프 월드 만족도 조사 | Welcome to Deaf World Survey</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Noto Sans KR", "Pretendard", "Malgun Gothic", sans-serif;
    background: linear-gradient(135deg, #ffe3ec 0%, #fff4c2 50%, #d9f3e0 100%);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 12px;
    color: #161514;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  .card {
    background: #fff;
    border: 3px solid #161514;
    border-radius: 24px;
    box-shadow: 6px 6px 0 #161514;
    width: 100%;
    max-width: 640px;
    margin-top: auto;
    margin-bottom: auto;
    padding: 22px 20px 20px;
    text-align: center;
  }
  .wide { max-width: 720px; text-align: left; }
  .hidden { display: none !important; }
  button { font-family: inherit; }

  /* ---------- 언어 선택 ---------- */
  .lang-title { font-size: 29px; font-weight: 900; margin: 18px 0 26px; line-height: 1.5; }
  .lang-title .sub { display: block; font-size: 19px; font-weight: 500; color: #6a665d; margin-top: 4px; }
  .lang-grid { display: grid; gap: 18px; }
  .lang-btn {
    border: 4px solid #161514;
    background: #fafaf7;
    border-radius: 24px;
    padding: 28px;
    font-size: 29px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 6px 6px 0 #161514;
    transition: transform 0.15s;
  }
  .lang-btn:hover { transform: translateY(-2px); }
  .lang-btn.ko { background: #ffe3dc; }
  .lang-btn.en { background: #fff1b8; }

  /* ---------- 설문 (한 화면에 문항 하나) ---------- */
  .header-tag {
    display: inline-block;
    background: #d9432b;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.4;
    padding: 5px 16px;
    border: 3px solid #161514;
    border-radius: 16px;
    margin-bottom: 14px;
    cursor: default;
  }
  .progress {
    margin-top: 32px;
    height: 12px;
    background: #f0f0f0;
    border: 2px solid #161514;
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #d9432b, #f4c430, #3a74c8);
    transition: width 0.4s ease;
  }
  .step-label { font-size: 13px; color: #888; font-weight: 700; margin-bottom: 14px; }
  .qtitle {
    font-size: 27px;
    font-weight: 900;
    line-height: 1.35;
    margin-bottom: 18px;
    min-height: 2.7em;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .options { display: grid; gap: 10px; }
  .options.row5 { grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .options.row3 { grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .options.grid2 { grid-template-columns: 1fr 1fr; }
  .opt {
    border: 3px solid #161514;
    background: #fafaf7;
    border-radius: 16px;
    padding: 10px 4px;
    cursor: pointer;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.3;
    user-select: none;
    transition: transform 0.12s, background 0.15s;
  }
  .opt:hover { transform: translateY(-2px); }
  .opt .big { font-size: 40px; display: block; line-height: 1.2; margin-bottom: 4px; }
  .opt .small { font-size: 14px; color: #6a665d; font-weight: 500; display: block; }
  .opt.selected { background: #ffe3dc; box-shadow: 3px 3px 0 #161514; }
  .opt.selected-yellow { background: #fff1b8; box-shadow: 3px 3px 0 #161514; }
  .opt.skip {
    display: block;
    width: fit-content;
    margin: 10px auto 0;
    background: #f3f3f3;
    font-size: 14px;
    padding: 6px 14px;
    border-width: 2px;
  }
  .opt.skip.selected { background: #d9d6cf; box-shadow: 3px 3px 0 #161514; }
  .scale11 { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; }
  .scale11 .opt { padding: 10px 0; font-size: 17px; font-weight: 900; }
  .scale-hint { display: flex; justify-content: space-between; font-size: 14px; color: #6a665d; margin-top: 8px; }
  textarea {
    width: 100%;
    height: 130px;
    border: 3px solid #161514;
    border-radius: 16px;
    padding: 12px;
    font-size: 18px;
    font-family: inherit;
    resize: none;
    outline: none;
  }
  textarea:focus { background: #fffdf3; }

  .nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
  button.btn {
    flex: 0 0 auto;
    min-width: 120px;
    border: 3px solid #161514;
    border-radius: 18px;
    padding: 14px;
    font-size: 19px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 4px 4px 0 #161514;
    background: #fff;
    color: #161514;
  }
  .btn-prev { background: #f3f3f3; color: #555; }
  .btn-next { background: #f4c430; }
  .btn-danger { background: #ffd0c7; }
  button.btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

  /* 감사 안내 */
  .thanks {
    background: #fff8d6;
    border: 3px solid #161514;
    border-radius: 18px;
    padding: 32px 22px;
    line-height: 1.8;
    font-size: 19px;
    text-align: center;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  .thanks .big { font-size: 28px; font-weight: 900; margin-bottom: 14px; }
  .thanks .sign { font-weight: 700; margin-top: 16px; color: #444; }

  /* ---------- 담당자 화면 ---------- */
  .admin-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .admin-head h1 { font-size: 26px; font-weight: 900; }
  .hint { font-size: 13px; color: #6a665d; line-height: 1.6; }
  .total {
    display: inline-block;
    background: #161514;
    color: #fff;
    font-weight: 900;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 16px;
  }
  .panel {
    background: #fff;
    border: 3px solid #161514;
    border-radius: 20px;
    box-shadow: 5px 5px 0 #161514;
    padding: 20px;
    margin-bottom: 22px;
  }
  .panel h3 { font-size: 17px; font-weight: 900; margin-bottom: 12px; }
  .analysis { list-style: none; display: grid; gap: 10px; }
  .analysis li {
    background: #fff8d6;
    border: 2px solid #161514;
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 15px;
    line-height: 1.6;
  }
  .analysis li.warn { background: #ffe3dc; }
  .qrow { margin-bottom: 14px; }
  .qrow .qname { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  .bar-wrap { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 14px; }
  .bar-label { width: 110px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { flex: 1; background: #f0f0f0; border: 2px solid #161514; border-radius: 99px; height: 18px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, #f4c430, #d9432b); }
  .bar-num { width: 80px; text-align: right; font-weight: 700; flex-shrink: 0; }
  .avg { font-size: 15px; font-weight: 700; }
  .avg b { font-size: 22px; color: #d9432b; }
  .comment-list { list-style: none; display: grid; gap: 8px; max-height: 300px; overflow: auto; }
  .comment-list li { background: #fafaf7; border: 2px solid #161514; border-radius: 12px; padding: 10px 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
  .empty { color: #888; font-size: 14px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .btn-small {
    flex: 0 0 auto;
    padding: 10px 16px;
    font-size: 14px;
    box-shadow: 3px 3px 0 #161514;
    border-radius: 14px;
    border: 2.5px solid #161514;
    cursor: pointer;
    color: #161514;
    background: #fff;
  }
  .msg { font-size: 14px; font-weight: 700; margin-top: 8px; min-height: 20px; }
  .msg.ok { color: #2e7d32; }

  /* 만족도 이모티콘이 살짝씩 춤추듯 움직임 (순서마다 박자를 다르게) */
  @keyframes dance {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25%      { transform: translateY(-5px) rotate(-9deg); }
    50%      { transform: translateY(0) rotate(0deg); }
    75%      { transform: translateY(-3px) rotate(9deg); }
  }
  .options.row5 .opt .big {
    display: inline-block;
    animation: dance 1.8s ease-in-out infinite;
  }
  .options.row5 .opt:nth-child(1) .big { animation-delay: 0s; }
  .options.row5 .opt:nth-child(2) .big { animation-delay: -0.35s; }
  .options.row5 .opt:nth-child(3) .big { animation-delay: -0.7s; }
  .options.row5 .opt:nth-child(4) .big { animation-delay: -1.05s; }
  .options.row5 .opt:nth-child(5) .big { animation-delay: -1.4s; }
  @media (prefers-reduced-motion: reduce) {
    .options.row5 .opt .big { animation: none; }
  }

  /* 문항 위에 놓이는 작은 그림 */
  .qimg { width: 100%; max-width: 360px; height: 120px; margin: 0 auto 12px; border: 2.5px solid #161514; border-radius: 16px; overflow: hidden; background: #f5f3ec; }
  .qimg img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .qicon { font-size: 44px; line-height: 1; margin-bottom: 10px; }
  .qimg video { width: 100%; height: 100%; object-fit: cover; display: block; background: #f5f3ec; }
  /* 영상 칸: 영상이 준비되기 전에는 테두리·배경 없이 비어 있음 (첫 장면이 준비되면 테두리가 생김) */
  .qimg.qvid { height: auto; aspect-ratio: auto; max-width: 280px; border: none; background: none; margin: 0 auto 12px; }
  .qimg video.qv { width: 100%; height: auto; aspect-ratio: 1 / 1; object-fit: cover; display: block; background: transparent; border: none; border-radius: 16px; }
  .qimg video.qv.ready { border: 2.5px solid #161514; }
  /* 사진은 박스 없이 바로 보이게 (사진이 없으면 onerror로 칸 전체가 사라짐) */
  .qimg:not(.qvid) { border: none; background: none; height: auto; margin-bottom: 8px; }

  /* 넓은 화면(PC·태블릿 가로): 이전/다음 버튼을 설문 박스 바깥 좌우 끝에 둠 */
  @media (min-width: 1000px) {
    #surveyView { position: relative; }
    #surveyView .nav {
      position: absolute;
      top: 50%;
      left: -150px;
      right: -150px;
      margin: 0;
      transform: translateY(-50%);
      justify-content: space-between;
      pointer-events: none;
    }
    #surveyView .nav button.btn { pointer-events: auto; }
  }

  /* 다음에 보고 싶은 프로그램: 프로그램 그림 */
  .othumb { width: 100%; max-width: 140px; height: auto; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 10px; display: block; margin: 0 auto 6px; border: none; }

  /* 첫 화면 */
  .intro-lang { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 26px; }
  .ilang {
    font-family: inherit; font-weight: 700; font-size: 15px; padding: 7px 16px;
    border: 2.5px solid #161514; border-radius: 999px; background: #fff; color: #161514; cursor: pointer;
  }
  .ilang.on { background: #161514; color: #fff; }
  #langView .lang-title { font-size: 30px; line-height: 1.4; margin: 28px 0 18px; }
  .intro-body { font-size: 18px; line-height: 1.8; color: #55514a; margin: 0 auto 34px; max-width: 520px; }
  .btn-start {
    font-family: inherit; font-size: 20px; font-weight: 900; padding: 16px 44px;
    border: 3px solid #161514; border-radius: 999px; background: #f4c430; color: #161514;
    box-shadow: 5px 5px 0 #161514; cursor: pointer;
  }
  .btn-start:hover { transform: translateY(-2px); }

  /* 이전/다음 버튼은 쓰지 않음 */
  #navRow { display: none !important; }
  /* 여러 개 고르는 질문의 완료 버튼 */
  .btn-q {
    display: block; margin: 22px auto 0; font-family: inherit; font-size: 19px; font-weight: 900;
    padding: 12px 36px; border: 3px solid #161514; border-radius: 999px; background: #f4c430;
    color: #161514; box-shadow: 4px 4px 0 #161514; cursor: pointer;
  }
  .btn-q:hover { transform: translateY(-2px); }
</style>
</head>
<body>

<!-- ===================== 언어 선택 화면 ===================== -->
<div class="card hidden" id="langView">
  <div class="intro-lang" role="group" aria-label="언어 선택">
    <button type="button" class="ilang" data-lang="ko">한국어</button>
    <button type="button" class="ilang" data-lang="en">English</button>
  </div>
  <div class="lang-title" id="langTitle">
    <span id="introTitle"></span>
  </div>
  <p class="intro-body" id="introBody"></p>
  <button type="button" class="btn-start" id="startBtn"></button>
</div>

<!-- ===================== 참가자 설문 화면 (한 화면에 문항 하나) ===================== -->
<div class="card hidden" id="surveyView">
  <span class="header-tag" id="headerTag"></span>
  <div id="page"></div>

  <div class="nav" id="navRow">
    <button class="btn btn-prev" id="prevBtn"></button>
    <button class="btn btn-next" id="nextBtn"></button>
  </div>

  <div class="progress"><div class="progress-bar" id="bar"></div></div>
  <div class="step-label" id="stepLabel"></div>

  <div id="thanksWrap" class="hidden">
    <div class="thanks" id="thanksBox"></div>
  </div>
</div>

<!-- ===================== 담당자 결과 화면 (제목을 3초 안에 5번 누르면 열림) ===================== -->
<div class="wide hidden" id="adminView" style="width:100%;margin-top:16px;">
  <div class="admin-head">
    <div>
      <h1>📊 만족도 조사 결과</h1>
      <p class="hint">이 기기에 저장된 응답을 바탕으로 자동 분석한 결과입니다.</p>
    </div>
    <span class="total" id="totalCount">응답 0명</span>
  </div>

  <div class="panel" id="statsPanel"></div>

  <div class="panel">
    <h3>💬 한마디 의견</h3>
    <ul class="comment-list" id="commentList"></ul>
  </div>

  <div class="panel">
    <h3>🔍 분석 결과</h3>
    <ul class="analysis" id="analysisList"></ul>
  </div>

  <div class="panel">
    <h3>🗂️ 관리</h3>
    <div class="actions">
      <button class="btn-small" id="xlsxBtn">엑셀 다운로드</button>
      <button class="btn-small btn-danger" id="clearBtn">전체 삭제</button>
      <button class="btn-small" id="backBtn">설문 화면으로</button>
    </div>
    <div class="msg" id="adminMsg"></div>
  </div>
</div>

<script>
  /* 문구 모음 */
  const UI = {
    ko: { tag: "웰컴 투 데프 월드 · 2026", prev: "이전", next: "다음", done: "제출하기" },
    en: { tag: "Welcome to Deaf World · 2026", prev: "Back", next: "Next", done: "Submit" }
  };

  const THANKS = {
    ko: `<div class="big">함께해 주셔서 감사합니다 🤟</div>
         웰컴 투 데프 월드에서 나눈 이야기와 경험이 여러분의 마음에 오래 남기를 바랍니다.<br>
         여러분의 솔직한 의견은 다음 행사를 더 나은 곳으로 만드는 데 소중하게 쓰이겠습니다.
         <div class="sign">— 모두 이야기 캠프 운영팀 일동</div>`,
    en: `<div class="big">Thank you for joining us! 🤟</div>
         We hope the stories and experiences you shared at Welcome to Deaf World stay with you for a long time.<br>
         Your honest feedback will help us make our next event even better.
         <div class="sign">— Moduseo Story Camp Team</div>`
  };

  /* 프로그램 만족도 선택지 (1~5점) */
  const PROG_OPTS = [
    { icon: "😞", label: "별로",       en: "Poor",       value: 1 },
    { icon: "😐", label: "보통",       en: "Okay",       value: 2 },
    { icon: "🙂", label: "좋아요",     en: "Good",       value: 3 },
    { icon: "😊", label: "아주 좋아요", en: "Very good", value: 4 },
    { icon: "🤩", label: "최고!",      en: "Excellent!", value: 5 }
  ];
  const SKIP_OPT = { icon: "🚫", label: "참여하지 않음", en: "Did not take part", value: 0 };

  /* 각 문항. label(한국어)은 저장 값이므로 바꾸지 마세요. en 은 영어 표시용입니다.
     skip: true 이면 "참여하지 않음" 선택지가 붙습니다.
     optional: true 이면 답하지 않아도 다음으로 넘어갈 수 있습니다. */
  const QUESTIONS = [
    {
      id: "overall", type: "emoji", img: "images/camp-poster.jpg",
      title: { ko: "오늘 행사, 마음속 온도는 몇 도였나요?", en: "How warm was your overall feeling about the event?" },
      options: [
        { icon: "😞", label: "별로",       en: "Poor",       value: 1 },
        { icon: "😐", label: "보통",       en: "Okay",       value: 2 },
        { icon: "🙂", label: "좋아요",     en: "Good",       value: 3 },
        { icon: "😊", label: "아주 좋아요", en: "Very good", value: 4 },
        { icon: "🤩", label: "최고!",      en: "Excellent!", value: 5 }
      ]
    },
    { id: "exhibit", type: "emoji", skip: true, vid: "videos/1.mp4", img: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 180'><rect width='300' height='180' fill='%23f5f3ec'/><rect x='85' y='35' width='130' height='95' rx='8' fill='%23263a78'/><rect x='95' y='45' width='110' height='75' rx='4' fill='%23dfe9f7'/><circle cx='150' cy='72' r='13' fill='%23263a78'/><path d='M118 118 Q118 92 150 92 Q182 92 182 118 Z' fill='%23263a78'/><rect x='140' y='130' width='20' height='12' fill='%23263a78'/><rect x='118' y='140' width='64' height='6' rx='3' fill='%23263a78'/></svg>",
      title: { ko: "전시는 마음에 얼마나 다가왔나요?", en: "How did the exhibition touch you?" }, options: PROG_OPTS },
    { id: "workshop", type: "emoji", skip: true, vid: "videos/2.mp4", icon: "🛠️",
      title: { ko: "워크숍에 참여해 본 느낌은 어땠나요?", en: "How did it feel to take part in the workshop?" }, options: PROG_OPTS },
    { id: "booth", type: "emoji", skip: true, vid: "videos/3.mp4", icon: "🏪",
      title: { ko: "부스를 둘러보는 발걸음은 즐거웠나요?", en: "Did walking through the booths feel joyful?" }, options: PROG_OPTS },
    { id: "slam", type: "emoji", skip: true, vid: "videos/4.mp4", icon: "🎤",
      title: { ko: "슬램의 열기는 얼마나 뜨거웠나요?", en: "How heated was the energy of the slam?" }, options: PROG_OPTS },
    { id: "performance", type: "emoji", skip: true, vid: "videos/5.mp4", icon: "🎭",
      title: { ko: "수어문학 공연의 여운은 얼마나 오래 남았나요?", en: "How lasting was the impression of the sign literature performance?" }, options: PROG_OPTS },
    {
      id: "pace", type: "choice", icon: "⏱️",
      title: { ko: "행사 시간(10:00~17:30)은 어땠나요?", en: "How was the event length (10:00–17:30)?" },
      options: [
        { icon: "🐢", label: "조금 길었어요", en: "A bit long" },
        { icon: "🚶", label: "적당했어요",   en: "Just right" },
        { icon: "🚀", label: "짧았어요",     en: "Too short" }
      ]
    },
    {
      id: "space", type: "emoji", icon: "🏛️",
      title: { ko: "공간에 머무는 동안 몸과 마음이 편안했나요?", en: "Did the space feel comfortable to stay in?" },
      options: [
        { icon: "😣", label: "불편",      en: "Uncomfortable",    value: 1 },
        { icon: "😕", label: "조금",      en: "A little",         value: 2 },

      options: [

    {

      placeholder: {
        ko: "좋았던 점, 아쉬웠던 점, 바라는 점을 자유롭게 적어 주세요.",
        en: "Tell us what you liked, what could be better, or your wishes."
      }
    }
  ];

  /* ---------- 영상 구간 설정 ----------
     [시작 초, 끝 초] 로 쓰면 그 구간만 반복 재생합니다. [0, 0] 이면 영상 전체를 반복합니다.
     예) "videos/1.mp4": [3, 12]  → 3초부터 12초까지만 반복 */
  const CLIPS = {
    "videos/1.mp4": [0, 0],
    "videos/2.mp4": [0, 0],
    "videos/3.mp4": [0, 0],
    "videos/4.mp4": [0, 0],
    "videos/5.mp4": [0, 0]
  };
  function clipOf(src) {
    return CLIPS[src] || [0, 0];
  }
  function clipEnd(v, en) {
    return en > 0 ? en : v.duration;
  }
  // 영상 메타정보가 준비되면 시작 지점으로 이동
  document.addEventListener("loadedmetadata", e => {
    const v = e.target;
    if (!v.dataset || !v.dataset.clip) return;
    const [s, en] = clipOf(v.dataset.clip);
    if (!(en > 0)) return; // 구간 설정이 없으면 브라우저 기본 반복 재생을 그대로 사용
    v.currentTime = s;
    if (v.hasAttribute("autoplay")) v.play().catch(() => {});
  }, true);
  // 첫 장면이 준비되면 테두리를 보여 줌
  document.addEventListener("loadeddata", e => {
    if (e.target.classList && e.target.classList.contains("qv")) e.target.classList.add("ready");
  }, true);
  // 구간 끝에 닿으면 다시 시작 지점으로
  document.addEventListener("timeupdate", e => {
    const v = e.target;
    if (!v.dataset || !v.dataset.clip || !v.hasAttribute("autoplay")) return;
    const [s, en] = clipOf(v.dataset.clip);
    if (!(en > 0)) return;
    if (v.currentTime >= clipEnd(v, en) - 0.05 || v.currentTime < s) v.currentTime = s;
  }, true);
  document.addEventListener("ended", e => {
    const v = e.target;
    if (!v.dataset || !v.dataset.clip) return;
    if (!(clipOf(v.dataset.clip)[1] > 0)) return;
    v.currentTime = clipOf(v.dataset.clip)[0];
    v.play().catch(() => {});
  }, true);

  /* ---------- 저장소 (이 기기 안에만 저장됨) ---------- */
  const KEY = "wdw_survey_responses";

  function loadList() {
    try { return JSON.parse(localStorage.getItem(KEY) || "[]"); }
    catch (e) { return []; }
  }
  function saveList(list) {
    localStorage.setItem(KEY, JSON.stringify(list));
  }

  /* ---------- 참가자 화면 ---------- */
  let lang = "ko";
  let current = 0;
  const answers = {};
  let advanceTimer = null;
  let resetTimer = null;

  const elLang = document.getElementById("langView");
  const elSurvey = document.getElementById("surveyView");
  const elPage = document.getElementById("page");
  const elHeader = document.getElementById("headerTag");
  const elBar = document.getElementById("bar");
  const elStep = document.getElementById("stepLabel");
  const btnPrev = document.getElementById("prevBtn");
  const btnNext = document.getElementById("nextBtn");
  const elNav = document.getElementById("navRow");
  const elThanksWrap = document.getElementById("thanksWrap");
  const elThanks = document.getElementById("thanksBox");

  function optText(o) {
    return lang === "ko" ? o.label : o.en;
  }

  function isAnswered(q) {
    const a = answers[q.id];
    if (q.type === "text") return true;
    if (q.type === "multi") return Array.isArray(a) && a.length > 0;
    return a !== undefined && a !== null;
  }

  function canGoNext(q) {
    return q.optional || isAnswered(q);
  }

  function optionsHTML(q) {
    const sel = v => (answers[q.id] === v ? "selected" : "");
    let h = "";

    if (q.type === "emoji") {
      h += `<div class="options row5">`;
      q.options.forEach(o => {
        h += `<div class="opt ${sel(o.value)}" data-v="${o.value}">
                <span class="big">${o.icon}</span>
                <span class="small">${optText(o)}</span>
              </div>`;
      });
      h += `</div>`;
      if (q.skip) {
        h += `<div class="opt skip ${sel(0)}" data-v="0">${SKIP_OPT.icon} ${optText(SKIP_OPT)}</div>`;
      }
    }

    if (q.type === "choice") {
      h += `<div class="options row3">`;
      q.options.forEach(o => {
        const cls = answers[q.id] === o.label ? "selected-yellow" : "";
        h += `<div class="opt ${cls}" data-v="${o.label}">
                <span class="big">${o.icon}</span>${optText(o)}
              </div>`;
      });
      h += `</div>`;
    }

    if (q.type === "multi") {
      const picked = answers[q.id] || [];
      h += `<div class="options grid2">`;
      q.options.forEach(o => {
        const cls = picked.includes(o.label) ? "selected" : "";
        const pic = o.vid
          ? `<video class="othumb" src="${o.vid}" poster="${o.vid.replace('.mp4', '.jpg')}" muted playsinline preload="none" onerror="this.remove()"></video>`
          : o.thumb
          ? `<img class="othumb" src="${o.thumb}" alt="" onerror="this.remove()">`
          : `<span class="big">${o.icon}</span>`;
        h += `<div class="opt ${cls}" data-v="${o.label}">
                ${pic}${optText(o)}
              </div>`;
      });
      h += `</div>`;
    }

    if (q.type === "scale") {
      h += `<div class="scale11">`;
      for (let n = q.min; n <= q.max; n++) {
        h += `<div class="opt ${sel(n)}" data-v="${n}">${n}</div>`;
      }
      h += `</div><div class="scale-hint"><span>${q.hint[lang][0]}</span><span>${q.hint[lang][1]}</span></div>`;
    }

    if (q.type === "text") {
      const v = answers[q.id] || "";
      h += `<textarea id="textInput" placeholder="${q.placeholder[lang]}">${v}</textarea>`;
    }

    return h;
  }

  function render() {
    const total = QUESTIONS.length;
    const q = QUESTIONS[current];

    elBar.style.width = (current / total * 100) + "%";
    elStep.textContent = (current + 1) + " / " + total;

    let media = "";
    if (q.vid) media = `<div class="qimg qvid"><video class="qv" src="${q.vid}" poster="${q.vid.replace('.mp4', '.jpg')}" data-clip="${q.vid}" autoplay muted loop playsinline preload="auto" onerror="this.parentNode.remove()"></video></div>`;
    else if (q.img) media = `<div class="qimg"><img src="${q.img}" alt="" onerror="this.parentNode.remove()"></div>`;
    else if (q.icon) media = `<div class="qicon">${q.icon}</div>`;
    elPage.innerHTML = media + `<div class="qtitle">${q.title[lang]}</div>` + optionsHTML(q);

    // 여러 개 고르는 질문과 마지막 한마디 질문에만 완료 버튼을 둔다
    if (q.type === "multi" || q.type === "text") {
      const label = q.type === "text" ? UI[lang].done : (lang === "ko" ? "선택 완료" : "Done");
      elPage.insertAdjacentHTML("beforeend", `<button type="button" class="btn-q" id="qAction">${label}</button>`);
      document.getElementById("qAction").addEventListener("click", goNext);
    }
  }

  function goNext() {
    const total = QUESTIONS.length;
    if (current < total - 1) {
      current++;
      render();
    } else {
      showFinish();
    }
  }
  function goPrev() {
    if (current > 0) {
      current--;
      render();
    }
  }

  /* 선택지 클릭: 한 곳에서 처리 */
  elPage.addEventListener("click", e => {
    const el = e.target.closest(".opt");
    if (!el) return;
    const q = QUESTIONS[current];
    const v = el.dataset.v;

    if (q.type === "multi") {
      const arr = answers[q.id] || [];
      answers[q.id] = arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v];
      render();
      return;
    }

    if (q.type === "choice") answers[q.id] = v;
    else answers[q.id] = Number(v);

    render();

    // 한 개만 고르는 문항은 잠시 뒤 자동으로 다음 문항
    clearTimeout(advanceTimer);
    advanceTimer = setTimeout(() => {
      if (QUESTIONS[current] === q) goNext();
    }, 250);
  });

  elPage.addEventListener("input", e => {
    if (e.target.id === "textInput") {
      answers.comment = e.target.value;
      btnNext.disabled = false;
    }
  });

  function showFinish() {
    const list = loadList();
    list.push({ a: JSON.parse(JSON.stringify(answers)), lang, t: Date.now() });
    saveList(list);

    elBar.style.width = "100%";
    elStep.textContent = "";
    elPage.innerHTML = "";
    elNav.classList.add("hidden");
    elThanks.innerHTML = THANKS[lang];
    elThanksWrap.classList.remove("hidden");

    // 5초 뒤 언어 선택 화면으로 돌아가기 (다음 참가자용)
    clearTimeout(resetTimer);
    resetTimer = setTimeout(resetSurvey, 5000);
  }

  function resetSurvey() {
    Object.keys(answers).forEach(k => delete answers[k]);
    current = 0;
    elNav.classList.remove("hidden");
    elThanksWrap.classList.add("hidden");
    showLanguagePicker();
  }

  function showLanguagePicker() {
    elSurvey.classList.add("hidden");
    elLang.classList.remove("hidden");
    renderIntro();
  }

  function startSurvey(selected) {
    lang = selected;
    current = 0;
    Object.keys(answers).forEach(k => delete answers[k]);
    elHeader.textContent = UI[lang].tag;
    elLang.classList.add("hidden");
    elSurvey.classList.remove("hidden");
    elNav.classList.remove("hidden");
    elThanksWrap.classList.add("hidden");
    render();
  }

  /* 첫 화면: 감성 문구 + 언어 선택 + 시작 버튼 */
  const INTRO = {
    ko: {
      title: "여러분의 하루는 어떤 빛깔이었나요?",
      body: "웰컴 투 데프 월드에서 나눈 순간들이 여러분의 마음에 어떻게 닿았는지 궁금합니다. 몇 가지 질문에 천천히 답해 주시면, 다음 이야기를 더 따뜻하게 준비하겠습니다.",
      start: "시작하기"
    },
    en: {
      title: "What color was your day?",
      body: "We would love to know how the moments you shared at Welcome to Deaf World touched your heart. Answer a few questions at your own pace, and we will prepare the next story even warmer.",
      start: "Start"
    }
  };
  function renderIntro() {
    document.querySelectorAll(".ilang").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
    const t = INTRO[lang];
    document.getElementById("introTitle").textContent = t.title;
    document.getElementById("introBody").textContent = t.body;
    document.getElementById("startBtn").textContent = t.start;
  }
  document.querySelectorAll(".ilang").forEach(b => {
    b.addEventListener("click", () => { lang = b.dataset.lang; renderIntro(); });
  });
  document.getElementById("startBtn").addEventListener("click", () => startSurvey(lang));
  btnNext.addEventListener("click", goNext);
  btnPrev.addEventListener("click", goPrev);

  /* ---------- 분석 ---------- */
  function avgOf(list, id) {
    const v = list.map(r => r.a[id]).filter(x => typeof x === "number");
    return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null;
  }
  function avgOfTaken(list, id) {
    const v = list.map(r => r.a[id]).filter(x => typeof x === "number" && x > 0);
    return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null;
  }
  function countOf(list, q, label) {
    return list.filter(r => {
      const a = r.a[q.id];
      return Array.isArray(a) ? a.includes(label) : a === label;
    }).length;
  }
  function pct(c, n) { return n ? Math.round(c / n * 100) : 0; }

  function topOf(list, q) {
    let best = null;
    q.options.forEach(o => {
      const c = countOf(list, q, o.label);
      if (!best || c > best.c) best = { label: o.label, c };
    });
    return best;
  }

  function analyze(list) {
    const n = list.length;
    if (!n) return [{ text: "아직 응답이 없어서 분석할 내용이 없습니다.", warn: false }];

    const out = [];
    const byId = id => QUESTIONS.find(q => q.id === id);

    const ov = avgOf(list, "overall");
    const ovHigh = list.filter(r => r.a.overall >= 4).length;
    out.push({ text: `전체 만족도 평균은 5점 만점에 ${ov.toFixed(1)}점이며, 4점 이상을 준 응답은 ${pct(ovHigh, n)}%입니다.`, warn: ov < 3.5 });

    const programs = [
      { id: "exhibit", name: "전시" },
      { id: "workshop", name: "워크숍" },
      { id: "booth", name: "부스" },
      { id: "slam", name: "슬램" },
      { id: "performance", name: "수어문학 공연" }
    ];
    programs.forEach(p => {
      const taken = list.filter(r => r.a[p.id] > 0).length;
      const avg = avgOfTaken(list, p.id);
      if (avg === null) {
        out.push({ text: `${p.name}: 참여자가 없습니다. (참여하지 않음 ${pct(n - taken, n)}%)`, warn: false });
      } else {
        out.push({ text: `${p.name}: 참여율 ${pct(taken, n)}%, 참여자 만족도 평균 ${avg.toFixed(1)}점(5점 만점)`, warn: avg < 3.5 });
      }
    });

    const pace = topOf(list, byId("pace"));
    out.push({ text: `행사 시간은 '${pace.label}'이라는 응답이 가장 많았습니다(${pct(pace.c, n)}%).`, warn: pace.label === "조금 길었어요" });

    const space = avgOf(list, "space");
    out.push({ text: `공간 편안함 평균은 5점 만점에 ${space.toFixed(1)}점입니다.`, warn: space < 3.5 });
    const staff = avgOf(list, "staff");
    out.push({ text: `스태프 친절도 평균은 5점 만점에 ${staff.toFixed(1)}점입니다.`, warn: staff < 3.5 });

    const wishQ = byId("wish");
    const wishSorted = wishQ.options
      .map(o => ({ label: o.label, c: countOf(list, wishQ, o.label) }))
      .sort((a, b) => b.c - a.c);
    out.push({ text: `다음에 더 보고 싶은 프로그램은 '${wishSorted[0].label}'(${pct(wishSorted[0].c, n)}%)과 '${wishSorted[1].label}'(${pct(wishSorted[1].c, n)}%)입니다.`, warn: false });

    const rec = avgOf(list, "recommend");
    const recHigh = list.filter(r => typeof r.a.recommend === "number" && r.a.recommend >= 9).length;
    out.push({ text: `추천 점수 평균은 10점 만점에 ${rec.toFixed(1)}점이며, 9~10점을 준 응답은 ${pct(recHigh, n)}%입니다.`, warn: rec < 6 });

    const commentCount = list.filter(r => (r.a.comment || "").trim()).length;
    out.push({ text: `한마디 의견은 ${commentCount}건 남겨졌습니다.`, warn: false });

    return out;
  }

  /* ---------- 담당자 화면 ---------- */
  const elAdmin = document.getElementById("adminView");
  const elTotal = document.getElementById("totalCount");
  const elStats = document.getElementById("statsPanel");
  const elComments = document.getElementById("commentList");
  const elAnalysis = document.getElementById("analysisList");
  const elAdminMsg = document.getElementById("adminMsg");

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function barRow(label, count, p) {
    return `<div class="bar-wrap">
              <div class="bar-label" title="${esc(label)}">${esc(label)}</div>
              <div class="bar-track"><div class="bar-fill" style="width:${p}%"></div></div>
              <div class="bar-num">${count}명 (${p}%)</div>
            </div>`;
  }

  function renderAdmin() {
    const list = loadList();
    const n = list.length;
    elTotal.textContent = "응답 " + n + "명";

    elAnalysis.innerHTML = analyze(list)
      .map(a => `<li class="${a.warn ? "warn" : ""}">${esc(a.text)}</li>`)
      .join("");

    let html = `<h3>문항별 결과</h3>`;
    if (n === 0) {
      html += `<p class="empty">아직 응답이 없습니다.</p>`;
    } else {
      QUESTIONS.forEach(q => {
        if (q.type === "text") return;
        html += `<div class="qrow"><div class="qname">${esc(q.title.ko)}</div>`;

        if (q.type === "emoji") {
          q.options.forEach(o => {
            const c = list.filter(r => r.a[q.id] === o.value).length;
            html += barRow(`${o.icon} ${o.label}`, c, pct(c, n));
          });
          if (q.skip) {
            const c = list.filter(r => r.a[q.id] === 0).length;
            html += barRow(`${SKIP_OPT.icon} ${SKIP_OPT.label}`, c, pct(c, n));
            const avg = avgOfTaken(list, q.id);
            html += `<div class="avg">참여자 평균 <b>${avg === null ? "-" : avg.toFixed(1)}</b> / 5</div>`;
          } else {
            const a = avgOf(list, q.id);
            html += `<div class="avg">평균 <b>${a === null ? "-" : a.toFixed(1)}</b> / 5</div>`;
          }
        }
        else if (q.type === "choice" || q.type === "multi") {
          q.options.forEach(o => {
            const c = countOf(list, q, o.label);
            html += barRow(`${o.icon} ${o.label}`, c, pct(c, n));
          });
        }
        else if (q.type === "scale") {
          const a = avgOf(list, q.id);
          html += `<div class="avg">평균 <b>${a === null ? "-" : a.toFixed(1)}</b> / 10</div>`;
        }
        html += `</div>`;
      });
    }
    elStats.innerHTML = html;

    const comments = list.map(r => (r.a.comment || "").trim()).filter(Boolean);
    elComments.innerHTML = comments.length
      ? comments.map(c => `<li>${esc(c)}</li>`).join("")
      : `<li class="empty" style="border:none;background:none;">아직 남겨진 의견이 없습니다.</li>`;
  }

  /* ---------- CSV 다운로드 (엑셀에서 한글이 깨지지 않도록 BOM 포함) ---------- */
  function csvCell(v) {
    const s = String(v === undefined || v === null ? "" : v);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function buildCSV(list) {
    const cols = ["응답번호", "응답시각", "언어"];
    QUESTIONS.forEach(q => {
      let name = q.title.ko;
      if (q.type === "emoji") name += q.skip ? " (1~5점, 0=참여하지 않음)" : " (1~5점)";
      if (q.type === "scale") name += " (0~10점)";
      cols.push(name);
    });

    const rows = [cols];
    list.forEach((r, i) => {
      const row = [i + 1, new Date(r.t).toLocaleString("ko-KR"), r.lang || "ko"];
      QUESTIONS.forEach(q => {
        const a = r.a[q.id];
        if (q.type === "multi") row.push(Array.isArray(a) ? a.join("; ") : "");
        else row.push(a === undefined || a === null ? "" : a);
      });
      rows.push(row);
    });
    return rows.map(r => r.map(csvCell).join(",")).join("\r\n");
  }

  function downloadCSV() {
    const list = loadList();
    if (!list.length) {
      elAdminMsg.textContent = "다운로드할 응답이 없습니다.";
      elAdminMsg.className = "msg";
      return;
    }
    const d = new Date();
    const pad = n => String(n).padStart(2, "0");
    const stamp = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;

    const blob = new Blob(["\uFEFF" + buildCSV(list)], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `만족도조사_${stamp}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);

    elAdminMsg.textContent = `응답 ${list.length}건을 CSV 파일로 내려받았습니다.`;
    elAdminMsg.className = "msg ok";
  }
  /* ---------- 엑셀(.xlsx) 다운로드: 1번 탭 = 응답, 2번 탭 = 분석결과 ---------- */
  const CRC_TABLE = (() => {
    const t = [];
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(bytes) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  /* 압축 없이 파일들을 하나로 묶는 zip 만들기 */
  function makeZip(files) {
    const enc = new TextEncoder();
    const parts = [];
    const central = [];
    let offset = 0;

    files.forEach(f => {
      const nameBytes = enc.encode(f.name);
      const data = enc.encode(f.text);
      const crc = crc32(data);

      const local = new Uint8Array(30 + nameBytes.length);
      const lv = new DataView(local.buffer);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);
      lv.setUint16(12, 0x21, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, data.length, true);
      lv.setUint32(22, data.length, true);
      lv.setUint16(26, nameBytes.length, true);
      local.set(nameBytes, 30);
      parts.push(local, data);

      const cen = new Uint8Array(46 + nameBytes.length);
      const cv = new DataView(cen.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(14, 0x21, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, data.length, true);
      cv.setUint32(24, data.length, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint32(42, offset, true);
      cen.set(nameBytes, 46);
      central.push(cen);

      offset += local.length + data.length;
    });

    const cenSize = central.reduce((s, c) => s + c.length, 0);
    const end = new Uint8Array(22);
    const ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, cenSize, true);
    ev.setUint32(16, offset, true);

    return new Blob([...parts, ...central, end],
      { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  }

  function colName(i) {
    let s = "";
    i += 1;
    while (i > 0) {
      const m = (i - 1) % 26;
      s = String.fromCharCode(65 + m) + s;
      i = Math.floor((i - 1) / 26);
    }
    return s;
  }

  function xmlEsc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function sheetXML(rows) {
    let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
            '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
    rows.forEach((r, ri) => {
      x += `<row r="${ri + 1}">`;
      r.forEach((v, ci) => {
        if (v === "" || v === null || v === undefined) return;
        const ref = colName(ci) + (ri + 1);
        if (typeof v === "number") x += `<c r="${ref}"><v>${v}</v></c>`;
        else x += `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
      });
      x += `</row>`;
    });
    return x + `</sheetData></worksheet>`;
  }

  /* 1번 탭: 응답 원본 */
  function buildResponseRows(list) {
    const head = ["응답번호", "응답시각", "언어"];
    QUESTIONS.forEach(q => {
      let name = q.title.ko;
      if (q.type === "emoji") name += q.skip ? " (1~5점, 0=참여하지 않음)" : " (1~5점)";
      if (q.type === "scale") name += " (0~10점)";
      head.push(name);
    });
    const rows = [head];
    list.forEach((r, i) => {
      const row = [i + 1, new Date(r.t).toLocaleString("ko-KR"), r.lang || "ko"];
      QUESTIONS.forEach(q => {
        const a = r.a[q.id];
        if (q.type === "multi") row.push(Array.isArray(a) ? a.join("; ") : "");
        else row.push(a === undefined || a === null ? "" : a);
      });
      rows.push(row);
    });
    return rows;
  }

  /* 2번 탭: 분석결과 (자동 분석 문장 + 문항별 집계) */
  function buildAnalysisRows(list) {
    const n = list.length;
    const rows = [["만족도 조사 분석 결과"], ["응답 수", n], []];

    rows.push(["[분석 요약]"]);
    analyze(list).forEach(a => rows.push([a.text]));
    rows.push([]);

    rows.push(["[문항별 집계]"]);
    QUESTIONS.forEach(q => {
      if (q.type === "text") return;
      rows.push([q.title.ko]);

      if (q.type === "emoji") {
        rows.push(["선택지", "응답 수", "비율(%)"]);
        q.options.forEach(o => {
          const c = list.filter(r => r.a[q.id] === o.value).length;
          rows.push([`${o.icon} ${o.label}`, c, pct(c, n)]);
        });
        if (q.skip) {
          const c = list.filter(r => r.a[q.id] === 0).length;
          rows.push([`${SKIP_OPT.icon} ${SKIP_OPT.label}`, c, pct(c, n)]);
          const avg = avgOfTaken(list, q.id);
          rows.push(["참여자 평균(5점)", avg === null ? "-" : Number(avg.toFixed(2))]);
        } else {
          const avg = avgOf(list, q.id);
          rows.push(["평균(5점)", avg === null ? "-" : Number(avg.toFixed(2))]);
        }
      }
      else if (q.type === "choice" || q.type === "multi") {
        rows.push(["선택지", "응답 수", "비율(%)"]);
        q.options.forEach(o => {
          const c = countOf(list, q, o.label);
          rows.push([`${o.icon} ${o.label}`, c, pct(c, n)]);
        });
      }
      else if (q.type === "scale") {
        const avg = avgOf(list, q.id);
        rows.push(["평균(10점)", avg === null ? "-" : Number(avg.toFixed(2))]);
      }
      rows.push([]);
    });
    return rows;
  }

  function downloadXLSX() {
    const list = loadList();
    if (!list.length) {
      elAdminMsg.textContent = "다운로드할 응답이 없습니다.";
      elAdminMsg.className = "msg";
      return;
    }
    const d = new Date();
    const pad = v => String(v).padStart(2, "0");
    const stamp = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;

    const NS = 'xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"';
    const files = [
      { name: "[Content_Types].xml", text:
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
        '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
        '<Default Extension="xml" ContentType="application/xml"/>' +
        '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
        '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
        '<Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
        '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
        '</Types>' },
      { name: "_rels/.rels", text:
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
        '</Relationships>' },
      { name: "xl/workbook.xml", text:
        `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook ${NS} xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">` +
        '<sheets><sheet name="응답" sheetId="1" r:id="rId1"/><sheet name="분석결과" sheetId="2" r:id="rId2"/></sheets>' +
        '</workbook>' },
      { name: "xl/_rels/workbook.xml.rels", text:
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
        '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/>' +
        '<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
        '</Relationships>' },
      { name: "xl/styles.xml", text:
        `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet ${NS}>` +
        '<fonts count="1"><font><sz val="11"/><name val="Malgun Gothic"/></font></fonts>' +
        '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>' +
        '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
        '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
        '<cellXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/></cellXfs>' +
        '</styleSheet>' },
      { name: "xl/worksheets/sheet1.xml", text: sheetXML(buildResponseRows(list)) },
      { name: "xl/worksheets/sheet2.xml", text: sheetXML(buildAnalysisRows(list)) }
    ];

    const blob = makeZip(files);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `만족도조사_${stamp}.xlsx`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);

    elAdminMsg.textContent = `응답 ${list.length}건을 엑셀 파일로 내려받았습니다. (1번 탭: 응답, 2번 탭: 분석결과)`;
    elAdminMsg.className = "msg ok";
  }
  document.getElementById("xlsxBtn").addEventListener("click", downloadXLSX);

  document.getElementById("clearBtn").addEventListener("click", () => {
    if (!confirm("이 기기에 저장된 응답을 모두 삭제할까요? 되돌릴 수 없습니다.")) return;
    localStorage.removeItem(KEY);
    renderAdmin();
    elAdminMsg.textContent = "모든 응답을 삭제했습니다.";
    elAdminMsg.className = "msg ok";
  });

  /* ---------- 화면 전환 (제목을 3초 안에 5번 누르면 담당자 화면) ---------- */
  function openAdmin() {
    elSurvey.classList.add("hidden");
    elLang.classList.add("hidden");
    elAdmin.classList.remove("hidden");
    renderAdmin();
  }
  function closeAdmin() {
    elAdmin.classList.add("hidden");
    showLanguagePicker();
  }

  let tapTimes = [];
  function onTitleTap() {
    const now = Date.now();
    tapTimes = tapTimes.filter(t => now - t <= 3000);
    tapTimes.push(now);
    if (tapTimes.length >= 5) {
      tapTimes = [];
      openAdmin();
    }
  }
  document.getElementById("langTitle").addEventListener("click", onTitleTap);
  document.getElementById("headerTag").addEventListener("click", onTitleTap);
  document.getElementById("backBtn").addEventListener("click", closeAdmin);

  showLanguagePicker();
</script>
